<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1485 850">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9fdcd6"/>
      <stop offset="0.45" stop-color="#f6dc9a"/>
      <stop offset="0.7" stop-color="#8f6f8f"/>
      <stop offset="1" stop-color="#2c2a3e"/>
    </linearGradient>
    <radialGradient id="solG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6c8"/>
      <stop offset="1" stop-color="#ffc84a"/>
    </radialGradient>
    <linearGradient id="mar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2aa6a0"/>
      <stop offset="0.55" stop-color="#3a7f8a"/>
      <stop offset="1" stop-color="#1c2a3a"/>
    </linearGradient>
    <linearGradient id="piel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fb06a"/>
      <stop offset="0.6" stop-color="#5f8a5a"/>
      <stop offset="1" stop-color="#3d4d48"/>
    </linearGradient>
    <linearGradient id="caparazon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8a04a"/>
      <stop offset="0.6" stop-color="#a8723a"/>
      <stop offset="1" stop-color="#4a3a36"/>
    </linearGradient>
    <pattern id="escamas" width="34" height="30" patternUnits="userSpaceOnUse">
      <rect width="34" height="30" fill="none"/>
      <polygon points="17,2 32,15 17,28 2,15" fill="none" stroke="#3d5a3a" stroke-width="2.5" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1485" height="850" fill="url(#cielo)"/>
  <circle cx="230" cy="150" r="70" fill="url(#solG)"/>
  <!-- luna fria lado sombra -->
  <circle cx="1330" cy="120" r="40" fill="#c8c8d8" opacity="0.7"/>
  <circle cx="1345" cy="110" r="38" fill="#2c2a3e"/>

  <!-- mar / suelo -->
  <path d="M0,690 Q370,665 740,690 T1485,690 L1485,850 L0,850Z" fill="url(#mar)"/>
  <g stroke="#bff0e8" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.6">
    <path d="M60,740 q30,-14 60,0 q30,14 60,0"/>
    <path d="M300,790 q30,-14 60,0 q30,14 60,0"/>
    <path d="M520,760 q30,-14 60,0 q30,14 60,0"/>
  </g>

  <!-- ALETAS traseras / delanteras -->
  <path d="M410,610 C330,640 280,700 300,720 C350,720 420,690 470,650Z" fill="url(#piel)" stroke="#2f4a30" stroke-width="5"/>
  <path d="M1060,620 C1130,650 1180,700 1160,725 C1110,725 1040,690 1000,655Z" fill="#46564a" stroke="#22302a" stroke-width="5"/>
  <path d="M530,640 C500,700 520,740 560,745 C600,740 610,690 600,650Z" fill="url(#piel)" stroke="#2f4a30" stroke-width="5"/>
  <path d="M880,645 C870,700 890,745 930,745 C970,740 975,690 950,645Z" fill="#4f6150" stroke="#22302a" stroke-width="5"/>

  <!-- CABEZA (izquierda) -->
  <g transform="translate(440 590) scale(1.3) translate(-440 -590)">
  <path d="M430,560 C360,540 300,520 250,540 C200,560 190,610 230,630 C280,650 360,630 440,620Z" fill="url(#piel)" stroke="#2f4a30" stroke-width="5"/>
  <path d="M430,560 C360,540 300,520 250,540 C200,560 190,610 230,630 C280,650 360,630 440,620Z" fill="url(#escamas)"/>
  <circle cx="252" cy="570" r="13" fill="#fff6dc" stroke="#2f4a30" stroke-width="3"/>
  <circle cx="249" cy="570" r="7" fill="#1a1a1a"/>
  <path d="M206,600 Q225,612 252,604" stroke="#2f4a30" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- CUERPO / borde inferior del caparazon -->
  <path d="M400,640 C420,600 1040,600 1080,640 C1060,670 420,670 400,640Z" fill="#7a5a32" stroke="#3a2a18" stroke-width="5"/>

  <!-- CAPARAZON -->
  <path d="M390,630 C390,340 560,210 740,210 C920,210 1090,340 1090,630Z" fill="url(#caparazon)" stroke="#3a2a18" stroke-width="7"/>
  <!-- placas geometricas -->
  <g fill="none" stroke="#6a4520" stroke-width="5" opacity="0.7">
    <path d="M460,630 C470,470 560,350 640,300"/>
    <path d="M1020,630 C1010,470 920,350 840,300"/>
    <path d="M410,520 C560,500 920,500 1070,520"/>
  </g>
  <g fill="#f0c46a" opacity="0.55">
    <polygon points="430,600 450,560 470,600"/>
    <polygon points="480,600 500,560 520,600"/>
    <polygon points="530,600 550,560 570,600"/>
    <polygon points="580,600 600,560 620,600"/>
    <polygon points="630,600 650,560 670,600"/>
    <polygon points="680,600 700,560 720,600"/>
    <polygon points="730,600 750,560 770,600"/>
  </g>
  <g fill="#6a5a50" opacity="0.6">
    <polygon points="780,600 800,560 820,600"/>
    <polygon points="830,600 850,560 870,600"/>
    <polygon points="880,600 900,560 920,600"/>
  </g>

  <!-- PUEBLO sobre el caparazon -->
  <!-- arboles -->
  <g>
    <rect x="575" y="200" width="10" height="50" fill="#5a3a1a"/>
    <circle cx="580" cy="190" r="34" fill="#3f9a4a"/>
    <circle cx="566" cy="178" r="14" fill="#6cc06a"/>
    <rect x="880" y="215" width="10" height="45" fill="#5a3a1a"/>
    <circle cx="885" cy="205" r="30" fill="#3f8a4a"/>
  </g>
  <!-- nido en el arbol -->
  <path d="M556,205 Q580,225 604,205 Q580,215 556,205Z" fill="#8a5a2a" stroke="#5a3a1a" stroke-width="3"/>
  <circle cx="572" cy="206" r="5" fill="#bfe8ff"/><circle cx="586" cy="206" r="5" fill="#bfe8ff"/>

  <!-- casa 1 (izq, baja) -->
  <g>
    <rect x="470" y="400" width="100" height="90" fill="#fbf6ea" stroke="#8a7a62" stroke-width="3"/>
    <polygon points="460,402 520,350 580,402" fill="#d8643a"/>
    <circle cx="500" cy="438" r="14" fill="#2aa6a0"/>
    <path d="M530,490 L530,450 Q545,436 560,450 L560,490Z" fill="#6a3a1a"/>
    <path d="M530,450 L520,455 L520,490 L530,490Z" fill="#a8723a"/>
  </g>
  <!-- casa 2 (centro alta) -->
  <g>
    <rect x="640" y="260" width="120" height="120" fill="#fbf6ea" stroke="#8a7a62" stroke-width="3"/>
    <polygon points="628,262 700,205 772,262" fill="#c8543a"/>
    <circle cx="672" cy="300" r="16" fill="#ffd25a"/>
    <circle cx="728" cy="300" r="16" fill="#ffd25a"/>
    <path d="M685,380 L685,340 Q700,326 715,340 L715,380Z" fill="#6a3a1a"/>
  </g>
  <!-- casa 3 -->
  <g>
    <rect x="590" y="400" width="110" height="100" fill="#fbf6ea" stroke="#8a7a62" stroke-width="3"/>
    <polygon points="580,402 645,350 710,402" fill="#e07a40"/>
    <circle cx="620" cy="440" r="14" fill="#ffd25a"/>
    <circle cx="670" cy="440" r="14" fill="#2aa6a0"/>
  </g>
  <!-- casa 4 -->
  <g>
    <rect x="780" y="290" width="100" height="100" fill="#f2ede0" stroke="#8a7a62" stroke-width="3"/>
    <polygon points="770,292 830,240 890,292" fill="#b8584a"/>
    <circle cx="830" cy="330" r="15" fill="#ffd25a"/>
  </g>
  <!-- casa 5 -->
  <g>
    <rect x="720" y="410" width="110" height="95" fill="#ece6d8" stroke="#8a7a62" stroke-width="3"/>
    <polygon points="710,412 775,360 840,412" fill="#a8584a"/>
    <circle cx="750" cy="450" r="14" fill="#f2c45a"/>
    <circle cx="800" cy="450" r="14" fill="#2a8a90"/>
  </g>

  <!-- ropa tendida entre casa 1 y casa 3 -->
  <path d="M560,395 Q600,420 640,380" stroke="#5a4a3a" stroke-width="3" fill="none"/>
  <path d="M570,402 l14,0 l0,22 l-14,0Z" fill="#e8344e"/>
  <path d="M592,410 l16,0 l-2,26 l-12,0Z" fill="#2fb3a8"/>
  <path d="M615,404 l14,0 l0,20 l-14,0Z" fill="#f7e04b"/>

  <!-- gente compartiendo (mesa y figuras) -->
  <g>
    <rect x="490" y="525" width="150" height="10" rx="4" fill="#8a5a2a"/>
    <circle cx="540" cy="520" r="9" fill="#e8344e"/>
    <circle cx="580" cy="518" r="10" fill="#f3a21c"/>
    <!-- figuras -->
    <circle cx="478" cy="505" r="12" fill="#6a3a2a"/>
    <path d="M466,520 Q478,512 490,520 L490,560 L466,560Z" fill="#2a8a90"/>
    <circle cx="655" cy="505" r="12" fill="#3a2a20"/>
    <path d="M643,520 Q655,512 667,520 L667,560 L643,560Z" fill="#d8643a"/>
    <circle cx="565" cy="490" r="11" fill="#8a5a3a"/>
    <path d="M554,503 Q565,496 576,503 L576,524 L554,524Z" fill="#9a3fb0"/>
    <path d="M490,530 L470,540 M643,530 L660,540" stroke="#3a2a20" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- LADO SOMBRA: casa cerrada con candado -->
  <g>
    <rect x="905" y="420" width="110" height="110" fill="#5a5660" stroke="#2a2830" stroke-width="4"/>
    <polygon points="895,422 960,368 1025,422" fill="#3a3640"/>
    <!-- ventana tapiada -->
    <circle cx="935" cy="455" r="15" fill="#2a2830"/>
    <path d="M920,448 L950,462 M920,462 L950,448" stroke="#7a7280" stroke-width="5"/>
    <!-- puerta cerrada -->
    <rect x="955" y="465" width="40" height="65" fill="#2a2830"/>
    <!-- cadena y candado -->
    <path d="M948,490 L1002,490" stroke="#9a9aa8" stroke-width="5" stroke-dasharray="7 4"/>
    <path d="M966,500 L966,490 Q975,476 984,490 L984,500" stroke="#c8c0a0" stroke-width="5" fill="none"/>
    <rect x="960" y="498" width="30" height="24" rx="4" fill="#c8a040" stroke="#5a4a1a" stroke-width="3"/>
  </g>

  <!-- persona dormida a la intemperie, junto al borde del caparazon -->
  <g transform="translate(1070 612) scale(1.35) translate(-1070 -612)">
    <path d="M1015,600 Q1060,575 1110,588 Q1135,598 1130,612 L1015,612Z" fill="#6a6470"/>
    <circle cx="1132" cy="596" r="13" fill="#4a3a30"/>
    <path d="M1008,612 L1140,612" stroke="#3a3440" stroke-width="5"/>
    <!-- caja de carton -->
    <rect x="1030" y="560" width="60" height="30" fill="#8a7050" opacity="0.6" transform="rotate(-8 1060 575)"/>
  </g>
  <!-- lluvia fria sobre la persona -->
  <g stroke="#9fb0c8" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <path d="M1030,470 l-8,20"/><path d="M1070,450 l-8,20"/><path d="M1110,480 l-8,20"/>
    <path d="M1150,440 l-8,20"/><path d="M1090,520 l-8,20"/><path d="M1140,530 l-8,20"/>
    <path d="M1190,490 l-8,20"/><path d="M1060,530 l-8,20"/>
  </g>
  <!-- nube gris -->
  <g fill="#3e3c4c">
    <circle cx="1080" cy="410" r="40"/><circle cx="1130" cy="395" r="50"/><circle cx="1180" cy="415" r="38"/>
    <rect x="1060" y="410" width="140" height="40" rx="20"/>
  </g>
</svg>
