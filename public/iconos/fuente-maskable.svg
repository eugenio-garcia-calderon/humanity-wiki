<!--
  VARIANTE «MASKABLE» (2026-08-22, Programador 3).
  Igual que la cuadrada pero con el dibujo al 60% y centrado, dejando un 20%
  de margen por lado. Android recorta el icono con formas distintas según el
  fabricante — círculo, cuadrado, gota — y sin ese margen el anillo se corta.
  La zona segura es el círculo central del 80%: todo lo que importa vive ahí.
-->
