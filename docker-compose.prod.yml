# ============================================================================
# TECHOS DE MEMORIA (2026-08-23, prog6)
# ============================================================================
# Hasta hoy NINGÚN servicio tenía techo (`mem_limit=0` en los cinco, medido con
# `docker inspect`). Con la memoria libre eso no se nota — hasta que algo se
# desboca. Y entonces no elige el que se desbocó: elige el kernel, que mata al
# proceso que más memoria ocupa, y en esta máquina ese suele ser **Postgres**.
#
# O sea: un fallo en la aplicación podía llevarse por delante la base de datos
# y el servicio de copias, que son las dos cosas que no se pueden perder.
#
# Hay un caso concreto esperando a que eso pase: `navegadorRemoto.ts` abre un
# Chromium DENTRO del contenedor `app` (ver `Dockerfile:25`), con un temporizador
# de apagado que solo conoce el suyo. El día que se reparta el trabajo entre los
# ocho núcleos serían ocho Chromium. Con estos techos, eso mata a `app` —que se
# reinicia solo— en vez de a la base de datos.
#
# ── LOS NÚMEROS SALEN DE MEDIR, NO DE ESTIMAR ──────────────────────────────
# En reposo, medido con `docker stats` el 2026-08-23 sobre 15,2 GB de máquina:
#
#     app 144 MB · db 109 MB · caddy 13 MB · copias 1,9 MB · copias-remoto 1,7 MB
#
# Unos 270 MB de 15,2 GB. Los techos son entre 10 y 30 veces eso a propósito:
# NO son un presupuesto, son un tope de daño. Un techo ajustado mata un
# contenedor sano un martes por la tarde, y eso es peor que no tener techo.
#
# ── QUÉ PASA AL TOCAR EL TECHO, PORQUE CONVIENE SABERLO ────────────────────
# El kernel mata el proceso dentro del contenedor y `restart: unless-stopped` lo
# levanta otra vez. Quien se entera: el `healthcheck` de cada servicio, y para
# las copias además el aviso de las 36 horas.
#
# LO QUE ESTO NO PROTEGE: la compilación del despliegue (`up -d --build`) corre
# FUERA de estos contenedores, en el propio dockerd. Quedan ~7,7 GB libres para
# ella, que es de sobra hoy.
# ============================================================================
# humanity.wiki — producción (Hetzner). Tres servicios:
#   db    → PostgreSQL 17 + PostGIS (datos en volumen persistente)
#   app   → la plataforma (API + frontend estático), detrás de Caddy
#   caddy → HTTPS automático (Let's Encrypt) y proxy inverso
# Uso:  docker compose -f docker-compose.prod.yml up -d --build
# Variables: copiar .env.production.example → .env.production y rellenar.
# ============================================================================
services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SQL_DB_NAME:-humanity}
      POSTGRES_USER: ${SQL_ADMIN_USER:-humanity}
      POSTGRES_PASSWORD: ${SQL_ADMIN_PASSWORD:?falta SQL_ADMIN_PASSWORD}
    # 2 GB. Postgres reserva 128 MB fijos (`shared_buffers`) y hasta 4 MB por
    # operación de ordenación, con 100 conexiones posibles: el peor caso teórico
    # no llega a esto ni de lejos. Es la primera que no puede morir.
    mem_limit: 2g
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SQL_ADMIN_USER:-humanity} -d ${SQL_DB_NAME:-humanity}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      args:
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-}
    restart: unless-stopped
    env_file: .env.production
    # 4 GB, el más alto de los cinco, y es donde vive Chromium. Hoy usa 144 MB;
    # un Chromium con varias pestañas se pone en cientos de megas. Este techo
    # existe para que un Chromium desbocado mate a `app` y no a la base de datos.
    mem_limit: 4g
    environment:
      NODE_ENV: production
      SQL_HOST: db
      UPLOADS_DIR: /data/uploads
    volumes:
      # Los archivos subidos (imágenes pegadas en el lienzo) viven fuera del
      # contenedor: si estuvieran dentro, cada despliegue los borraría.
      - uploads:/data/uploads
      # SOLO LECTURA, y el `:ro` es la parte importante: la aplicación enseña el
      # estado de las copias en la página pública de Servidores (2026-08-22,
      # Eugenio: «mete esta info de las copias de seguridad en la parte de
      # información»). Leer el estado no puede convertirse nunca en poder
      # borrarlo — quien entre por un agujero de la aplicación no puede tocar
      # aquí. Los dos ficheros que lee son `estado.json` y `estado-remoto.json`.
      - copias:/copias:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Copias de seguridad de la base de datos (2026-08-22). Un volcado al día,
  # comprobado, en un volumen del servidor — que es lo que la copia de disco de
  # Hetzner se lleva luego fuera de la máquina. Cómo restaurarlo y por qué está
  # hecho así: `deploy/copias/CLAUDE.md`.
  #
  # Misma imagen que `db` a propósito: `pg_dump` tiene que ser de la misma
  # versión que el Postgres del que lee, o se niega a trabajar.
  copias:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    # Sin esto, la imagen intentaría arrancar un Postgres suyo. Aquí solo
    # queremos sus herramientas de cliente.
    # 1 GB. Hoy usa 1,9 MB: solo canaliza lo que `pg_dump` va escribiendo. El
    # margen es para el día que la base de datos sea mucho mayor, y porque este
    # servicio es lo segundo que no puede morir.
    mem_limit: 1g
    entrypoint: ["/bin/bash", "/opt/copias/copias.sh"]
    environment:
      PGHOST: db
      PGUSER: ${SQL_ADMIN_USER:-humanity}
      PGPASSWORD: ${SQL_ADMIN_PASSWORD:?falta SQL_ADMIN_PASSWORD}
      PGDATABASE: ${SQL_DB_NAME:-humanity}
      COPIAS_DIR: /copias
      COPIAS_DIAS: ${COPIAS_DIAS:-14}
      COPIAS_MESES: ${COPIAS_MESES:-6}
    volumes:
      - ./deploy/copias:/opt/copias:ro
      - copias:/copias
    depends_on:
      db:
        condition: service_healthy
    # El fallo peligroso de una copia no es que falle: es que deje de hacerse
    # sin que nadie se entere. Si la última tiene más de 36 h, el contenedor
    # sale como `unhealthy` en `docker ps`.
    healthcheck:
      test: ["CMD", "bash", "/opt/copias/salud.sh"]
      interval: 15m
      timeout: 30s
      retries: 2
      start_period: 5m

  # Se lleva los volcados FUERA de Hetzner (2026-08-22, petición de Eugenio).
  # `copias` protege del error humano; esto protege de perder el servidor o la
  # cuenta, que es lo que una copia en la misma máquina no puede cubrir.
  #
  # SIN CREDENCIALES NO HACE NADA y sale sano igualmente: se queda esperando y
  # lo dice en el registro. Configurarlo es rellenar las cuatro variables
  # `COPIAS_REMOTO_*` de `.env.production` y reiniciar este servicio.
  copias-remoto:
    image: rclone/rclone:1
    restart: unless-stopped
    # 256 MB. Hoy usa 1,7 MB: sube ficheros de 1,3 MB de uno en uno.
    mem_limit: 256m
    entrypoint: ["/bin/sh", "/opt/copias/remoto.sh"]
    environment:
      COPIAS_DIR: /copias
      COPIAS_REMOTO_CUBO: ${COPIAS_REMOTO_CUBO:-}
      # rclone se configura entero por variables de entorno: no hay fichero de
      # configuración que mantener ni secreto que acabe en el repositorio.
      RCLONE_CONFIG_FUERA_TYPE: s3
      RCLONE_CONFIG_FUERA_PROVIDER: ${COPIAS_REMOTO_PROVEEDOR:-Cloudflare}
      RCLONE_CONFIG_FUERA_ENDPOINT: ${COPIAS_REMOTO_ENDPOINT:-}
      RCLONE_CONFIG_FUERA_ACCESS_KEY_ID: ${COPIAS_REMOTO_CLAVE_ID:-}
      RCLONE_CONFIG_FUERA_SECRET_ACCESS_KEY: ${COPIAS_REMOTO_CLAVE_SECRETA:-}
      RCLONE_CONFIG_FUERA_NO_CHECK_BUCKET: "true"
    volumes:
      - ./deploy/copias:/opt/copias:ro
      # Solo lectura: este servicio sube lo que hay, no le toca nada a nadie.
      # La única excepción es su propio fichero de estado, y por eso el volumen
      # no puede ir entero en `:ro`.
      - copias:/copias
    depends_on:
      - copias
    healthcheck:
      test: ["CMD", "sh", "/opt/copias/salud-remoto.sh"]
      interval: 15m
      timeout: 60s
      retries: 2
      start_period: 2m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # 256 MB. Hoy usa 13 MB. Va aquí y no más bajo porque si Caddy muere no se
    # cae una función: se cae humanity.wiki entera.
    mem_limit: 256m
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # El certificado de origen de Cloudflare, para los subdominios de cada
      # persona (`nombre.humanity.wiki`). La carpeta puede estar VACIA sin que
      # pase nada: el bloque comodin del Caddyfile sigue comentado hasta que
      # los ficheros existan, y Caddy no se entera. Al reves si importaria —
      # activar el bloque sin los ficheros deja a Caddy sin arrancar, y eso
      # tira humanity.wiki entera.
      - ./deploy/certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  # Los volcados. Van en un volumen y no dentro del contenedor por lo mismo que
  # `uploads`: un despliegue rehace el contenedor y se los llevaría por delante.
  copias:
  uploads:
  caddy_data:
  caddy_config:
