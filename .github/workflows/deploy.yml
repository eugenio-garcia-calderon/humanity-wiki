# ============================================================================
# Despliegue continuo de humanity.wiki
# ============================================================================
# Cada merge a `main` conecta por SSH al servidor y levanta la nueva versión.
# Se activa cuando existan estos secretos en GitHub (Settings → Secrets →
# Actions): DEPLOY_HOST (IP del Hetzner), DEPLOY_USER (p. ej. deploy),
# DEPLOY_SSH_KEY (clave privada ed25519 exclusiva para despliegues).
# Hasta entonces, el job termina en "saltado" sin fallar.

name: Deploy humanity.wiki

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar si el despliegue está configurado
        id: check
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "DEPLOY_HOST no configurado — despliegue omitido (aún sin servidor)."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Desplegar por SSH
        if: steps.check.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/humanity-wiki
            git fetch origin main
            git reset --hard origin/main
            # La clave de Together (modelos abiertos gratis) viaja como secreto
            # de GitHub y se escribe en el .env.production del servidor en cada
            # despliegue: así rotar la clave es cambiar el secreto y desplegar,
            # sin entrar por SSH a mano. Se borra la línea vieja y se añade la
            # nueva para que la rotación sustituya, no acumule.
            if [ -n "${{ secrets.TOGETHER_API_KEY }}" ]; then
              sed -i '/^TOGETHER_API_KEY=/d' .env.production
              echo "TOGETHER_API_KEY=${{ secrets.TOGETHER_API_KEY }}" >> .env.production
            fi
            # LA LLAVE MAESTRA de los permisos de Google de cada persona
            # (2026-08-23). Estaba puesta como secreto en GitHub y NO LLEGABA AL
            # SERVIDOR: comprobado en las dos puntas — el secreto existía, el
            # workflow no lo nombraba, y `grep -c "^CLAVE_MAESTRA=" ` en el
            # `.env.production` de producción daba 0. La función de conectar
            # cuentas se desplegó sin su llave.
            #
            # PONER UN SECRETO EN GITHUB NO HACE NADA POR SÍ SOLO: este fichero
            # solo escribe las variables que nombra. Quien añada un secreto
            # nuevo tiene que añadir también su línea aquí, y comprobarlo EN EL
            # SERVIDOR, no en la pantalla de GitHub.
            #
            # Y ojo con rotarla: es la llave con la que se cifran los permisos
            # de Google. Si cambia, todo el mundo tiene que volver a conectar su
            # cuenta. No es una clave de API cualquiera.
            if [ -n "${{ secrets.CLAVE_MAESTRA }}" ]; then
              sed -i '/^CLAVE_MAESTRA=/d' .env.production
              echo "CLAVE_MAESTRA=${{ secrets.CLAVE_MAESTRA }}" >> .env.production
            fi
            # ══ LAS LLAVES QUE HOY SOLO VIVEN EN EL SERVIDOR ═══════════════════
            # De las 27 variables del `.env.production`, este fichero solo sabía
            # reponer 7. Las otras 20 existen ÚNICAMENTE en ese fichero, en esa
            # máquina — la misma de la que las copias de seguridad protegen.
            #
            # O sea: los datos a salvo en Cloudflare y las llaves para leerlos
            # solo en el servidor que puede desaparecer. Es la diferencia entre
            # «tengo copias» y «puedo volver».
            #
            # Estas líneas son la TUBERÍA, y están puestas aunque los secretos
            # todavía no existan: si no están en GitHub, el `if` no hace nada y
            # el despliegue sigue igual. El día que Eugenio pegue uno, llega
            # solo. Mismo patrón que el servicio de copias esperando su cubo.
            #
            # QUÉ SE PIERDE HOY SI SE PIERDE LA MÁQUINA, por orden de gravedad:
            #  · CLAVE_FIRMA_REGISTRO / CLAVES_PUBLICAS_REGISTRO — el libro
            #    sellado no se puede verificar ni continuar. Su valor entero era
            #    ser comprobable.
            #  · STRIPE_* — los cobros no vuelven hasta sacarlas otra vez.
            #  · ANTHROPIC / GEMINI / MAPBOX — molestia, no pérdida.
            #
            # LO QUE NO SE REPONE DESDE AQUÍ, Y ES A PROPÓSITO:
            #  · SQL_ADMIN_PASSWORD. Es la contraseña que la BASE DE DATOS ya
            #    tiene guardada en su volumen. Escribirla desde un secreto que
            #    no coincida dejaría a la aplicación sin poder abrir su propia
            #    base — un despliegue en verde y la plataforma muerta. Se
            #    documenta en `deploy/copias/CLAUDE.md` y no se automatiza.
            for v in CLAVE_FIRMA_REGISTRO CLAVES_PUBLICAS_REGISTRO STRIPE_SECRET_KEY \
                     STRIPE_PUBLISHABLE_KEY STRIPE_WEBHOOK_SECRET ANTHROPIC_API_KEY \
                     GEMINI_API_KEY VITE_MAPBOX_TOKEN; do
              case "$v" in
                CLAVE_FIRMA_REGISTRO)     nuevo="${{ secrets.CLAVE_FIRMA_REGISTRO }}" ;;
                CLAVES_PUBLICAS_REGISTRO) nuevo="${{ secrets.CLAVES_PUBLICAS_REGISTRO }}" ;;
                STRIPE_SECRET_KEY)        nuevo="${{ secrets.STRIPE_SECRET_KEY }}" ;;
                STRIPE_PUBLISHABLE_KEY)   nuevo="${{ secrets.STRIPE_PUBLISHABLE_KEY }}" ;;
                STRIPE_WEBHOOK_SECRET)    nuevo="${{ secrets.STRIPE_WEBHOOK_SECRET }}" ;;
                ANTHROPIC_API_KEY)        nuevo="${{ secrets.ANTHROPIC_API_KEY }}" ;;
                GEMINI_API_KEY)           nuevo="${{ secrets.GEMINI_API_KEY }}" ;;
                VITE_MAPBOX_TOKEN)        nuevo="${{ secrets.VITE_MAPBOX_TOKEN }}" ;;
              esac
              # Solo si el secreto existe. Un secreto ausente NO borra la línea
              # que ya hay en el servidor: eso convertiría este arreglo en la
              # forma más rápida de dejar la plataforma sin sus llaves.
              if [ -n "$nuevo" ]; then
                sed -i "/^$v=/d" .env.production
                echo "$v=$nuevo" >> .env.production
              fi
            done
            # Las llaves de Cloudflare R2, donde viven las copias de seguridad
            # de la base de datos fuera de Hetzner (2026-08-22, prog6). Mismo
            # camino que la de Together: el secreto vive en GitHub, nunca en el
            # repositorio ni en el contexto de un agente, y se reescribe en cada
            # despliegue — así rotarlo es cambiar el secreto y volver a
            # desplegar, sin entrar por SSH.
            #
            # EL BORRADO VA FUERA DEL `if`, y es a propósito: si algún día se
            # quitan estos secretos de GitHub, las líneas viejas tienen que
            # DESAPARECER del servidor. Rotar una llave también es poder
            # quitarla; si el borrado viviera dentro, una llave retirada seguiría
            # viva en el `.env.production` para siempre.
            #
            # Y UNA SOLA CONDICIÓN PARA LAS CUATRO: o están todas o no está
            # ninguna. Media configuración es peor que ninguna — el servicio lo
            # intentaría, fallaría, y saldría en rojo por un motivo que no es el
            # de verdad. Sin ellas, `copias-remoto` arranca, dice en su registro
            # que está sin configurar y espera sin romper nada.
            for v in COPIAS_REMOTO_CUBO COPIAS_REMOTO_ENDPOINT COPIAS_REMOTO_CLAVE_ID COPIAS_REMOTO_CLAVE_SECRETA; do
              sed -i "/^$v=/d" .env.production
            done
            # DOS NOMBRES PARA LA MISMA LLAVE, y no es despiste: al guardarla en
            # GitHub quedó como `COPIAS_REMOTO_CUBO_ID` en vez de
            # `COPIAS_REMOTO_CLAVE_ID`, y GitHub no deja renombrar un secreto.
            # Se acepta el que haya. Cuesta una línea y ahorra tener que crear
            # otra llave en Cloudflare solo por el nombre — que es exactamente
            # el momento en el que se pierde una llave buena.
            CLAVE_ID="${{ secrets.COPIAS_REMOTO_CLAVE_ID }}"
            [ -z "$CLAVE_ID" ] && CLAVE_ID="${{ secrets.COPIAS_REMOTO_CUBO_ID }}"
            if [ -n "$CLAVE_ID" ]; then
              echo "COPIAS_REMOTO_CUBO=${{ secrets.COPIAS_REMOTO_CUBO }}"                   >> .env.production
              echo "COPIAS_REMOTO_ENDPOINT=${{ secrets.COPIAS_REMOTO_ENDPOINT }}"           >> .env.production
              echo "COPIAS_REMOTO_CLAVE_ID=$CLAVE_ID"                                       >> .env.production
              echo "COPIAS_REMOTO_CLAVE_SECRETA=${{ secrets.COPIAS_REMOTO_CLAVE_SECRETA }}" >> .env.production
            fi
            # Las dos llaves del TURN de Cloudflare, por el mismo camino y por
            # el mismo motivo (2026-08-22). Son las que hacen que conecten las
            # llamadas que no encuentran ruta directa —entre un 10 % y un 15 %,
            # las de redes de empresa y algunas móviles—. Si no están, la
            # aplicación arranca igual y sirve solo STUN: no se cae nada, esas
            # llamadas concretas no conectan y se dice en pantalla.
            if [ -n "${{ secrets.CLOUDFLARE_TURN_KEY_ID }}" ]; then
              sed -i '/^CLOUDFLARE_TURN_KEY_ID=/d' .env.production
              echo "CLOUDFLARE_TURN_KEY_ID=${{ secrets.CLOUDFLARE_TURN_KEY_ID }}" >> .env.production
            fi
            if [ -n "${{ secrets.CLOUDFLARE_TURN_API_TOKEN }}" ]; then
              sed -i '/^CLOUDFLARE_TURN_API_TOKEN=/d' .env.production
              echo "CLOUDFLARE_TURN_API_TOKEN=${{ secrets.CLOUDFLARE_TURN_API_TOKEN }}" >> .env.production
            fi
            # LAS LLAVES DE GOOGLE (2026-08-23, prog8). Mismo camino que las
            # demás. La clave maestra con la que se cifra el permiso de cada
            # persona ya la escribe el bloque de arriba: **no se repite aquí**.
            # Dos sitios escribiendo la misma variable es cómo se acaba
            # cambiándola en uno y no en el otro.
            #
            # `GOOGLE_REDIRECT_URI` no es un secreto —es una dirección pública—
            # pero se escribe aquí igualmente: tiene que coincidir LETRA POR
            # LETRA con la que esté dada de alta en la consola de Google, y
            # dejarla suelta en un `.env` a mano es dejarla a merced del
            # siguiente `git reset --hard` del despliegue.
            for v in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REDIRECT_URI; do
              sed -i "/^$v=/d" .env.production
            done
            if [ -n "${{ secrets.GOOGLE_CLIENT_SECRET }}" ]; then
              echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}"         >> .env.production
              echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env.production
              echo "GOOGLE_REDIRECT_URI=https://humanity.wiki/api/google/vuelta" >> .env.production
            fi
            # Migraciones ANTES de reconstruir: si una falla, el código nuevo
            # no llega a arrancar y la app vieja sigue en pie con su esquema.
            bash deploy/migrate.sh
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
            # CADDY SE RECREA SIEMPRE, Y NO ES POR CAPRICHO (2026-08-22).
            #
            # Su configuración entra por un montaje de UN FICHERO
            # (`./deploy/Caddyfile`). `git reset --hard` no edita ese fichero:
            # lo SUSTITUYE, y el contenedor sigue viendo el inodo viejo. Como
            # la definición del servicio no cambia, `up -d` tampoco lo recrea.
            #
            # Resultado: un cambio en el Caddyfile se desplegaba, salía en
            # verde, y no llegaba nunca. Medido ese día — el fichero del
            # servidor tenía la regla nueva y el contenedor no. Se descubrió
            # porque la cabecera no cambió; podría haber sido el bloque de los
            # subdominios, y entonces habría parecido que el certificado
            # fallaba.
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --force-recreate caddy
            docker image prune -f
            # Espera y comprobación de salud: si la app no responde, el job falla.
            sleep 10
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T app wget -qO- http://127.0.0.1:3000/api/health >/dev/null || (docker compose -f docker-compose.prod.yml --env-file .env.production logs --tail 50 app && exit 1)
