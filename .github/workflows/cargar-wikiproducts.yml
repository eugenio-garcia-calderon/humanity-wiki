# ============================================================================
# Cargar los datos de Wikiproducts en producción (2026-10-18, W3a)
# ============================================================================
# Se lanza a mano (Actions → «Cargar Wikiproducts» → Run workflow). Entra por
# SSH con los mismos secretos que el despliegue y ejecuta
# `scripts/wikiproducts/cargar-en-servidor.sh`, que crea una clave temporal en
# la base de datos, carga las tablas como la dueña del sitio y la borra al
# terminar, salga bien o mal. La clave no sale nunca del servidor ni aparece en
# este registro.
#
# Tiene su propio grupo: un despliegue que llega a la cola ya no la cancela
# (2026-10-18, otras sesiones fusionan a main mientras carga). Antes de empezar
# espera a que acabe cualquier despliegue en marcha, para cargar contra la
# versión ya desplegada; y si un despliegue reinicia la aplicación a mitad,
# `cargar-en-servidor.sh` espera a que vuelva y repite el paso.
# Se puede repetir: la carga es idempotente.

name: Cargar Wikiproducts

on:
  workflow_dispatch:
    inputs:
      fotos:
        description: "Cargar también las fotos: una por producto, de la página de la marca o de la tienda, guardada en el servidor"
        type: choice
        options: ["no", "si"]
        default: "no"

concurrency:
  group: cargar-wikiproducts
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  cargar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Esperar a que acabe el despliegue en marcha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow deploy.yml --limit 10 --json status \
                  --jq '[.[] | select(.status != "completed")] | length')
            [ "$n" = "0" ] && { echo "Ningún despliegue en marcha."; exit 0; }
            echo "Hay $n despliegue(s) en marcha o en cola; espero 30 s…"; sleep 30
          done
          echo "Sigue habiendo despliegues tras 30 minutos; cargo igualmente."
      - name: Cargar por SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          WP_FOTOS: ${{ inputs.fotos }}
        with:
          envs: WP_FOTOS
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Unas 700 escrituras a 30 por minuto: media hora larga.
          command_timeout: 80m
          script: |
            cd /opt/humanity-wiki && echo "Versión desplegada: $(git rev-parse --short HEAD)" && bash scripts/wikiproducts/cargar-en-servidor.sh
